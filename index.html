<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nursing Question Bank | BSc in Nursing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #FAF9F6; --card-bg: #FFFFFF;
      --primary-accent: #0F5257; --primary-dark: #0B3E42;
      --bg-soft: #E8F0EE; --border-color: #DCE4E1;
      --text-main: #1E2A2A; --text-muted: #4B5A5A;
      --warning-accent: #C98A3E; --warning-soft: #FBF0E0;
      --font-heading: 'Lora', serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px;
      --shadow-subtle: 0 2px 5px rgba(15,82,87,0.04);
      --shadow-hover: 0 8px 18px rgba(15,82,87,0.08);
      --transition-base: 0.25s ease; --transition-fade: 0.35s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-primary); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--primary-accent); font-weight: 600; line-height: 1.3; }
    a { text-decoration: none; color: inherit; }

    .top-header { position: sticky; top: 0; z-index: 100; background-color: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border-color); padding: 12px 24px; }
    .header-content { max-width: 960px; margin: 0 auto; display: flex; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .badge-icon { width: 36px; height: 36px; background-color: var(--bg-soft); border: 1px solid var(--border-color); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--primary-accent); font-size: 1.15rem; flex-shrink: 0; }
    .brand-text h1 { font-size: 1.1rem; letter-spacing: -0.2px; }

    .breadcrumb-nav { background-color: var(--bg-soft); border-bottom: 1px solid var(--border-color); padding: 8px 24px; font-size: 0.82rem; }
    .breadcrumb-container { max-width: 960px; margin: 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--text-muted); }
    .breadcrumb-item { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: color var(--transition-base); }
    .breadcrumb-item:hover { color: var(--primary-accent); text-decoration: underline; }
    .breadcrumb-item.current { color: var(--primary-dark); font-weight: 600; cursor: default; text-decoration: none; }
    .separator { color: #93A6A0; font-size: 0.75rem; }

    .main-wrapper { max-width: 960px; width: 100%; margin: 0 auto; padding: 24px 24px 56px; flex: 1; }
    .view-container { animation: fadeIn var(--transition-fade); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .section-header { margin-bottom: 18px; }
    .section-header h2 { font-size: 1.4rem; }

    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 640px) { .grid-container { grid-template-columns: 1fr; } .main-wrapper { padding: 18px 16px 40px; } }
    
    .item-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base); cursor: pointer; box-shadow: var(--shadow-subtle); }
    .item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #B5CCC7; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-title { font-size: 1.1rem; color: var(--primary-accent); margin-bottom: 4px; font-weight: 600; }
    .card-subtitle { font-size: 0.8rem; color: var(--text-muted); }
    .card-code { display: inline-block; font-size: 0.7rem; font-weight: 600; color: var(--primary-accent); background-color: var(--bg-soft); padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; }

    .status-pill { font-size: 0.72rem; font-weight: 500; padding: 4px 10px; border-radius: 20px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .status-pill.available { background-color: var(--bg-soft); color: var(--primary-accent); border: 1px solid #C4D7D2; }
    .status-pill.pending { background-color: var(--warning-soft); color: var(--warning-accent); border: 1px solid #F0D5B0; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: currentColor; }
    .card-footer-info { font-size: 0.78rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }

    .marks-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

    .accordion-list { display: flex; flex-direction: column; gap: 10px; }
    .accordion-item { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; transition: border-color var(--transition-base); }
    .accordion-item.active { border-color: #B5CCC7; }
    .accordion-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; transition: background-color var(--transition-base); }
    .accordion-header:hover { background-color: #F8FAF9; }
    .accordion-title { font-family: var(--font-heading); font-size: 1rem; color: var(--primary-accent); font-weight: 600; }
    .accordion-toggle-icon { color: var(--text-muted); font-size: 1rem; transition: transform var(--transition-base); }
    .accordion-item.active .accordion-toggle-icon { transform: rotate(180deg); color: var(--primary-accent); }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background-color: #FCFDFD; border-top: 1px solid transparent; }
    .accordion-item.active .accordion-body { border-top-color: var(--border-color); }
    .accordion-body-inner { padding: 14px 18px; display: flex; gap: 10px; }
    .option-btn { flex: 1; text-align: center; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-weight: 600; font-size: 0.88rem; background-color: var(--bg-soft); color: var(--primary-dark); cursor: pointer; transition: var(--transition-base); }
    .option-btn:hover { background-color: var(--primary-accent); color: #fff; }
    .option-btn.pending { background-color: var(--warning-soft); color: var(--warning-accent); border-color: #F0D5B0; cursor: not-allowed; }
    .option-btn.pending:hover { background-color: var(--warning-soft); color: var(--warning-accent); }

    .empty-card { background-color: var(--card-bg); border: 2px dashed var(--border-color); border-radius: var(--radius-lg); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 520px; margin: 20px auto; }
    .empty-icon { font-size: 2rem; }
    .empty-msg { font-size: 0.9rem; color: var(--text-muted); }
    
    .btn-secondary { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-soft); color: var(--primary-dark); font-weight: 600; cursor: pointer; transition: var(--transition-base); margin-top: 10px; }
    .btn-secondary:hover { background: var(--primary-accent); color: #fff; }

    footer { text-align: center; padding: 20px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
    footer .credit { font-weight: 500; color: var(--primary-accent); }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="header-content">
      <div class="brand" onclick="navigateTo('years')">
        <div class="badge-icon">📖</div>
        <div class="brand-text"><h1>Nursing Question Bank</h1></div>
      </div>
    </div>
  </header>

  <nav class="breadcrumb-nav"><div class="breadcrumb-container" id="breadcrumb"></div></nav>

  <main class="main-wrapper"><div id="app-view" class="view-container"></div></main>

  <footer>
    <span>BSc in Nursing — Previous Year Question Archive</span>
    <span class="credit">Built by Amrito</span>
  </footer>

  <script>
    const LINKS = {
      // B124: {
      //   2025: { written: "", mcq: "" },
      //   2018: { written: "" }
      // },
    };

    const EXAM_YEARS = [2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018];

    const PROGRAM = {
      years: [
        {
          id: 'year-1', name: '1st Year', totalMarks: 1000,
          status: 'available',
          subjects: [
            { code:'B111', name:'Communicative English', type:'General', written:60 },
            { code:'B112', name:'Nursing Informatics', type:'General', written:60 },
            { code:'B113', name:'Behavioral Science and Nursing Humanities', type:'General', written:90 },
            { code:'B124', name:'Anatomy', type:'Foundational', written:90 },
            { code:'B125', name:'Physiology', type:'Foundational', written:90 },
            { code:'B126', name:'Microbiology and Pathology', type:'Foundational', written:90 },
            { code:'B137', name:'Fundamentals of Nursing - I', type:'Professional', written:90 },
          ]
        },
        {
          id: 'year-2', name: '2nd Year', totalMarks: 1150,
          status: 'coming-soon',
          subjects: [
            { code:'B231', name:'Fundamentals of Nursing - II', type:'Professional', written:90 },
            { code:'B232', name:'Pediatric Nursing', type:'Professional', written:90 },
            { code:'B233', name:'Medical and Surgical Nursing - I', type:'Professional', written:90 },
            { code:'B224', name:'Pharmacology', type:'Foundational', written:60 },
            { code:'B235', name:'Traumatology and Orthopedic Nursing', type:'Professional', written:90 },
            { code:'B226', name:'Nutrition and Biochemistry', type:'Foundational', written:90 },
            { code:'B237', name:'Laws, Ethics and Forensic Nursing', type:'Professional', written:60 },
          ]
        },
        {
          id: 'year-3', name: '3rd Year', totalMarks: 950,
          status: 'coming-soon',
          subjects: [
            { code:'B331', name:'Geriatric Nursing', type:'Professional', written:90 },
            { code:'B332', name:'Mental Health and Psychiatric Nursing', type:'Professional', written:90 },
            { code:'B333', name:'Emergency and Critical Care Nursing', type:'Professional', written:90 },
            { code:'B334', name:'Medical and Surgical Nursing - II', type:'Professional', written:90 },
            { code:'B335', name:'Community Health Nursing and Epidemiology', type:'Professional', written:90 },
          ]
        },
        {
          id: 'year-4', name: '4th Year', totalMarks: 1000,
          status: 'coming-soon',
          subjects: [
            { code:'B431', name:'Midwifery', type:'Professional', written:90 },
            { code:'B432', name:'Obstetrical and Gynecological Nursing', type:'Professional', written:90 },
            { code:'B433', name:'Nursing Administration and Management', type:'Professional', written:60 },
            { code:'B434', name:'Nursing Education', type:'Professional', written:90 },
            { code:'B435', name:'Research and Bio-statistics', type:'Professional', written:90 },
            { code:'B416', name:'Advanced Communicative English', type:'General', written:60 },
          ]
        },
      ]
    };

    const MCQ_MARKS = 20;
    let currentRoute = { level: 'years', selectedYear: null, selectedSubject: null };

    function updateBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item ${currentRoute.level==='years'?'current':''}" onclick="navigateTo('years')">Home</span>`;
      if (currentRoute.selectedYear) {
        html += `<span class="separator">/</span><span class="breadcrumb-item ${currentRoute.level==='subjects'?'current':''}" onclick="selectYear('${currentRoute.selectedYear.id}')">${currentRoute.selectedYear.name}</span>`;
      }
      if (currentRoute.selectedSubject) {
        html += `<span class="separator">/</span><span class="breadcrumb-item current">${currentRoute.selectedSubject.name}</span>`;
      }
      nav.innerHTML = html;
    }

    function navigateTo(level) {
      currentRoute.level = level;
      if (level === 'years') { currentRoute.selectedYear = null; currentRoute.selectedSubject = null; renderYearsView(); }
      updateBreadcrumb();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderYearsView() {
      const container = document.getElementById('app-view');
      let html = `<div class="section-header"><h2>Select Your Year</h2></div><div class="grid-container">`;
      PROGRAM.years.forEach(year => {
        const isAvail = year.status === 'available';
        html += `
          <div class="item-card" onclick="selectYear('${year.id}')">
            <div class="card-top">
              <h3 class="card-title">${year.name}</h3>
              <span class="status-pill ${isAvail ? 'available' : 'pending'}">
                <span class="status-dot"></span> ${isAvail ? 'Available' : 'Coming soon'}
              </span>
            </div>
            <div class="card-footer-info"><span>${year.subjects.length} subjects</span><span>Total: ${year.totalMarks} marks</span></div>
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      updateBreadcrumb();
    }

    function selectYear(yearId) {
      const year = PROGRAM.years.find(y => y.id === yearId);
      currentRoute.selectedYear = year;
      currentRoute.selectedSubject = null;

      if (year.status === 'coming-soon') {
        renderComingSoonView(`Question papers for ${year.name} are being prepared`, 'years');
        return;
      }

      currentRoute.level = 'subjects';
      const container = document.getElementById('app-view');
      let html = `<div class="section-header"><h2>${year.name} — Subjects</h2></div><div class="grid-container">`;
      year.subjects.forEach(s => {
        html += `
          <div class="item-card" onclick="selectSubject('${s.code}')">
            <div class="card-top">
              <div>
                <span class="card-code">${s.code}</span>
                <h3 class="card-title">${s.name}</h3>
                <p class="card-subtitle">${s.type} Subject</p>
              </div>
            </div>
            <div class="card-footer-info"><span>Written: ${s.written} (MCQ/SBA: ${MCQ_MARKS})</span><span>›</span></div>
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      updateBreadcrumb();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function findSubject(code) {
      for (const y of PROGRAM.years) { 
        const s = y.subjects.find(x => x.code === code); 
        if (s) return s; 
      }
      return null;
    }

    function selectSubject(code) {
      const subject = findSubject(code);
      currentRoute.selectedSubject = subject;
      currentRoute.level = 'years-exam';
      const container = document.getElementById('app-view');

      let html = `
        <div class="section-header">
          <span class="card-code">${subject.code} • ${subject.type}</span>
          <h2>${subject.name}</h2>
          <p class="marks-note">Written: ${subject.written} marks (MCQ/SBA: ${MCQ_MARKS}, SAQ/SEQ${subject.written===90?'/EQ':''}: ${subject.written-MCQ_MARKS})</p>
        </div>
        <div class="accordion-list">`;

      EXAM_YEARS.forEach(ey => {
        const entry = (LINKS[subject.code] && LINKS[subject.code][ey]) || {};
        const writtenLink = entry.written || '';
        const mcqLink = ey === 2018 ? null : (entry.mcq || '');

        let btns = `<button class="option-btn ${writtenLink?'':'pending'}" onclick="${writtenLink ? `window.open('${writtenLink}','_blank')` : `alert('Written question for ${ey} not added yet.')`}">Written</button>`;
        if (mcqLink !== null) {
          btns += `<button class="option-btn ${mcqLink?'':'pending'}" onclick="${mcqLink ? `window.open('${mcqLink}','_blank')` : `alert('MCQ question for ${ey} not added yet.')`}">MCQ</button>`;
        }

        html += `
          <div class="accordion-item" id="acc-${ey}">
            <div class="accordion-header" onclick="toggleAccordion('acc-${ey}')">
              <span class="accordion-title">${ey}</span>
              <span class="accordion-toggle-icon">▼</span>
            </div>
            <div class="accordion-body">
              <div class="accordion-body-inner">${btns}</div>
            </div>
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      updateBreadcrumb();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleAccordion(id) {
      const item = document.getElementById(id);
      const body = item.querySelector('.accordion-body');
      const wasOpen = item.classList.contains('active');
      document.querySelectorAll('.accordion-item.active').forEach(el => {
        el.classList.remove('active');
        el.querySelector('.accordion-body').style.maxHeight = '0px';
      });
      if (!wasOpen) { item.classList.add('active'); body.style.maxHeight = body.scrollHeight + 'px'; }
    }

    function renderComingSoonView(message, backTarget) {
      currentRoute.level = 'empty';
      const container = document.getElementById('app-view');
      container.innerHTML = `
        <div class="empty-card">
          <div class="empty-icon">⏳</div>
          <h3>Coming Soon</h3>
          <p class="empty-msg">${message}. Please check back later.</p>
          <button class="btn-secondary" onclick="navigateTo('${backTarget}')">← Back to Home</button>
        </div>`;
      updateBreadcrumb();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => { renderYearsView(); });
  </script>
</body>
</html>
