<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f5c5e">
<meta name="description" content="BNMC B.Sc. in Nursing 2024: year-wise credits, marks, pass rules and question pattern in brief.">
<title>BNMC Exam System 2024 | Nursing Notebook</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="top-in"><a class="brand" href="index.html#home"><span class="mark">📘</span>Nursing Notebook</a>
<nav class="dnav" aria-label="Main"><a href="index.html#home">Home</a><a href="index.html#questions">Questions</a><a href="exam-system.html" class="on">Exam System</a><a href="about.html">About</a></nav></div></header>
<main id="app"></main>
<footer>Nursing Notebook — Rajshahi Medical University (RMU) · B.Sc. in Nursing</footer>
<nav class="bnav" aria-label="Main"><a href="index.html#home"><span>🏠</span>Home</a><a href="index.html#questions"><span>📝</span>Questions</a><a href="exam-system.html" class="on"><span>🎯</span>Exam</a><a href="about.html"><span>ℹ️</span>About</a></nav>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);let y=1,pdf=false;
const ord=['1st','2nd','3rd','4th'];
function rows(){return EXAM[y].map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}<br><span class="cat c${c[0][2]}">${CAT[c[0][2]]}</span></td><td>${c[2]}</td><td>${c[3]}</td><td><b>${c[4]}</b></td></tr>`).join('')}
function view(){const s=YSUM[y];
$('#app').innerHTML=`<div class="page"><h1 style="font-size:1.6rem">BNMC Exam System 2024</h1><p class="sub">B.Sc. in Nursing (4 years + 6 months internship). Brief, year-wise.</p>
<div class="g4"><div class="big y0"><b>4,100</b><span>Total marks</span></div><div class="big y1"><b>60%</b><span>Pass mark in each segment</span></div><div class="big y2"><b>206</b><span>Academic credits</span></div><div class="big y3"><b>25</b><span>Courses</span></div></div>
<div class="tabs">${[1,2,3,4].map(i=>`<button class="${i===y?'on':''}" onclick="y=${i};view()">${ord[i-1]} Year</button>`).join('')}</div>
<div class="sum"><div>Theory<b>${s.th}</b></div><div>Lab<b>${s.lab}</b></div><div>Clinical<b>${s.cl}</b></div><div>Year total<b>${s.tot}</b></div></div>
<div class="tw"><table><tr><th>Code</th><th>Course</th><th>Credits</th><th>Written</th><th>Total</th></tr>${rows()}<tr><td colspan="4"><b>${ord[y-1]} Year total marks</b></td><td><b>${s.m}</b></td></tr></table></div>
<h2 class="sec">Key rules</h2><div class="rules">
<div class="rule"><b>Pass mark:</b> 60% separately in Formative, Written, Oral and Practical.</div>
<div class="rule"><b>Eligibility for finals:</b> 85% theory and lab attendance, 100% clinical attendance, minimum 60% in formative assessments, and term exams passed.</div>
<div class="rule"><b>90-mark written (3 hrs):</b> MCQ 10 + SBA 10 (20 min), then Group A 35 + Group B 35 (2 h 40 m). Each group: 3 SAQ (5 each), 1 SEQ (10), 1 EQ (10).</div>
<div class="rule"><b>60-mark written (2.5 hrs):</b> MCQ 10 + SBA 10 (20 min), then Group A 20 + Group B 20 (2 h 10 m).</div>
<div class="rule"><b>Formative (10 + 10):</b> Theory: attendance 2, mid-term 4, assignment 4. Practical: attendance 2, report 4, case study 4. Pass is 6 out of 10.</div>
<div class="rule"><b>Grading:</b> A+ 80%+ (4.00) · A 75–79% (3.75) · A- 70–74% (3.50) · B+ 65–69% (3.25) · B 60–64% (3.00) · F below 60%.</div>
<div class="rule"><b>Registration:</b> valid for 8 years under the BNMC Act 2016.</div></div>
<h2 class="sec">Subject code system</h2><div class="rule"><b>B</b> = B.Sc. in Nursing · digit 1 = year · digit 2 = type (1 General, 2 Foundational, 3 Professional) · digit 3 = serial in that year.<br>Example: <b>B124</b> = 1st Year, Foundational, 4th subject (Anatomy).</div>
<h2 class="sec">Official document (PDF)</h2><div class="card"><div class="pdfbar"><button class="cta" style="animation:none" onclick="pdf=!pdf;tp()" id="pb">${pdf?'Hide PDF':'View PDF here'}</button><a class="cta" style="animation:none;background:#fff;border:1.5px solid var(--teal);color:var(--dark)" href="https://drive.google.com/file/d/${BNMC_PDF}/view" target="_blank" rel="noopener noreferrer">Open in new tab</a></div><div id="pf">${pdf?frame():''}</div></div>
<p class="sub" style="margin-top:12px">Source: BNMC B.Sc. in Nursing Curriculum 2024. This page is a summary; the PDF is the official reference.</p></div>`}
function frame(){return `<iframe class="pdf" style="margin-top:12px" src="https://drive.google.com/file/d/${BNMC_PDF}/preview" title="BNMC Examination System 2024 (PDF)" loading="lazy"></iframe>`}
function tp(){$('#pf').innerHTML=pdf?frame():'';$('#pb').textContent=pdf?'Hide PDF':'View PDF here'}
view();
</script></body></html>
